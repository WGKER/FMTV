name: Build FMTV APK
on:
  workflow_dispatch:
    inputs:
      build_decoder:
        description: '是否重新编译 mpv aar（仅首次需要，之后不用勾）'
        required: false
        type: boolean
        default: false

jobs:
  build_decoder:
    name: 编译 MPV 解码器 AAR（首次跑一次即可）
    if: ${{ inputs.build_decoder }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mpv-android
        uses: actions/checkout@v4
        with:
          repository: FongMi/mpv-android
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Accept SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Grant gradle permission
        run: chmod +x gradlew

      - name: Build decoder aar
        run: ./gradlew clean assembleRelease

      - name: Upload AAR（下载后上传到你自己仓库 Release）
        uses: actions/upload-artifact@v4
        with:
          name: mpv-decoder-aar
          path: |
            lib-decoder-ffmpeg/build/outputs/aar/lib-decoder-ffmpeg-release.aar
            lib-mpvplayer/build/outputs/aar/lib-mpvplayer-release.aar
          retention-days: 90

  build_fmtv:
    name: 打包 FMTV APK
    needs: build_decoder
    if: ${{ !inputs.build_decoder }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FMTV
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: 从你自己仓库 Release 下载 aar
        run: |
          mkdir -p app/libs
          wget -O app/libs/lib-decoder-ffmpeg-release.aar https://github.com/WGKER/FMTV/releases/latest/download/lib-decoder-ffmpeg-release.aar
          wget -O app/libs/lib-mpvplayer-release.aar https://github.com/WGKER/FMTV/releases/latest/download/lib-mpvplayer-release.aar
          ls -lh app/libs/

      - name: Generate keystore & local.properties
        run: |
          keytool -genkey -v -keystore test.jks -alias testkey -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass 123456 -keypass 123456 \
            -dname "CN=Test, OU=Test, O=Test, L=Test, S=Test, C=CN"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "storeFile=$PWD/test.jks" >> local.properties
          echo "keyAlias=testkey" >> local.properties
          echo "storePassword=123456" >> local.properties
          echo "keyPassword=123456" >> local.properties

      - name: Grant gradle permission
        run: chmod +x gradlew

      - name: Build FMTV Release
        run: ./gradlew clean assembleRelease

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/leanback/release/app-leanback-arm64-v8a-release.apk app/build/outputs/apk/leanback/release/leanback-arm64_v8a.apk
          mv app/build/outputs/apk/leanback/release/app-leanback-armeabi-v7a-release.apk app/build/outputs/apk/leanback/release/leanback-armeabi_v7a.apk
          mv app/build/outputs/apk/mobile/release/app-mobile-arm64-v8a-release.apk app/build/outputs/apk/mobile/release/mobile-arm64_v8a.apk
          mv app/build/outputs/apk/mobile/release/app-mobile-armeabi-v7a-release.apk app/build/outputs/apk/mobile/release/mobile-armeabi_v7a.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FMTV-Signed-APKs
          path: app/build/outputs/apk/leanback/release/leanback-arm64_v8a.apk, app/build/outputs/apk/leanback/release/leanback-armeabi_v7a.apk, app/build/outputs/apk/mobile/release/mobile-arm64_v8a.apk, app/build/outputs/apk/mobile/release/mobile-armeabi_v7a.apk
          retention-days: 90
