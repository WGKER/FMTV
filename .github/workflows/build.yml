name: Build FMTV APK
on:
  workflow_dispatch: # 只手动点击打包，push不自动跑

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate full local.properties（补齐签名占位，解决null报错）
        run: |
          cat > local.properties <<EOF
sdk.dir=$ANDROID_HOME
storeFile=
storePassword=
keyAlias=
keyPassword=
EOF
          cat local.properties

      - name: Accept SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 替换gradle为阿里云镜像（国内加速）
        run: |
          sed -i 's|https://services.gradle.org/distributions|https://mirrors.aliyun.com/maven/gradle|g' gradle/wrapper/gradle-wrapper.properties

      - name: Build with Gradle
        run: ./gradlew clean assembleRelease

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/leanback/release/app-leanback-arm64-v8a-release.apk app/build/outputs/apk/leanback/release/leanback-arm64_v8a.apk
          mv app/build/outputs/apk/leanback/release/app-leanback-armeabi-v7a-release.apk app/build/outputs/apk/leanback/release/leanback-armeabi_v7a.apk
          mv app/build/outputs/apk/mobile/release/app-mobile-arm64-v8a-release.apk app/build/outputs/apk/mobile/release/mobile-arm64_v8a.apk
          mv app/build/outputs/apk/mobile/release/app-mobile-armeabi-v7a-release.apk app/build/outputs/apk/mobile/release/mobile-armeabi_v7a.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: FMTV-APKs
          path: |
            app/build/outputs/apk/leanback/release/leanback-arm64_v8a.apk
            app/build/outputs/apk/leanback/release/leanback-armeabi_v7a.apk
            app/build/outputs/apk/mobile/release/mobile-arm64_v8a.apk
            app/build/outputs/apk/mobile/release/mobile-armeabi_v7a.apk
          retention-days: 90
