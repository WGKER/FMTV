name: Build FMTV APK
on:
  workflow_dispatch: # 只手动打包，不自动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set Android SDK env & local.properties
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          cat local.properties
          # 配置东软镜像，替换google源
          mkdir -p ~/.android
          echo 'sdk.manager.https.proxyPort=80' > ~/.android/sdkmanager.conf
          echo 'sdk.manager.https.proxyHost=mirrors.neusoft.edu.cn' >> ~/.android/sdkmanager.conf

      - name: Accept SDK licenses
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses
          # 预安装基础编译套件
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.2"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean assembleRelease

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/leanback/release/app-leanback-arm64-v8a-release.apk app/build/outputs/apk/leanback/release/leanback-arm64_v8a.apk
          mv app/build/outputs/apk/leanback/release/app-leanback-armeabi-v7a-release.apk app/build/outputs/apk/leanback/release/leanback-armeabi_v7a.apk
          mv app/build/outputs/apk/mobile/release/app-mobile-arm64-v8a-release.apk app/build/outputs/apk/mobile/release/mobile-arm64_v8a.apk
          mv app/build/outputs/apk/mobile/release/app-mobile-armeabi-v7a-release.apk app/build/outputs/apk/mobile/release/mobile-armeabi_v7a.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: FMTV-APKs
          path: |
            app/build/outputs/apk/leanback/release/leanback-arm64_v8a.apk
            app/build/outputs/apk/leanback/release/leanback-armeabi_v7a.apk
            app/build/outputs/apk/mobile/release/mobile-arm64_v8a.apk
            app/build/outputs/apk/mobile/release/mobile-armeabi_v7a.apk
          retention-days: 90
